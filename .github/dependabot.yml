version: 2
# Mensal e agrupado para não lotar a caixa de e-mail; alertas de segurança continuam imediatos.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-all:
        patterns: ['*']
    # Versões major mudam APIs e quebram o build: atualizar manualmente.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions-all:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
